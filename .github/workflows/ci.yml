name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run build -w apps/frontend

  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infrastructure/terraform fmt -check -recursive
      - run: terraform -chdir=infrastructure/terraform init -backend=false -input=false
      - run: terraform -chdir=infrastructure/terraform validate

  integration:
    name: Integration tests (LocalStack)
    runs-on: ubuntu-latest
    needs: [test, terraform]
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
    steps:
      - name: Skip when no LocalStack token is configured
        if: env.LOCALSTACK_AUTH_TOKEN == ''
        run: echo "::notice::Set the LOCALSTACK_AUTH_TOKEN secret to run integration tests."
      - uses: actions/checkout@v4
        if: env.LOCALSTACK_AUTH_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.LOCALSTACK_AUTH_TOKEN != ''
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: hashicorp/setup-terraform@v3
        if: env.LOCALSTACK_AUTH_TOKEN != ''
        with:
          terraform_wrapper: false
      - if: env.LOCALSTACK_AUTH_TOKEN != ''
        run: npm ci
      - name: Start LocalStack
        if: env.LOCALSTACK_AUTH_TOKEN != ''
        run: |
          echo "LOCALSTACK_AUTH_TOKEN=$LOCALSTACK_AUTH_TOKEN" > .env
          make up
      - name: Deploy infrastructure
        if: env.LOCALSTACK_AUTH_TOKEN != ''
        run: make infra
      - name: Run integration tests
        if: env.LOCALSTACK_AUTH_TOKEN != ''
        run: npm run test:integration
      - name: LocalStack logs
        if: failure() && env.LOCALSTACK_AUTH_TOKEN != ''
        run: docker compose logs localstack | tail -200
