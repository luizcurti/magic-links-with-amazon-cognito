name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests & build
    runs-on: ubuntu-latest
    outputs:
      has-localstack-token: ${{ steps.localstack-token.outputs.present }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (backend + frontend, 100% coverage required)
        run: npm run test:coverage
      - name: Build Lambdas
        run: npm run build
      - name: Build frontend
        run: npm run build -w apps/frontend
      - name: Validate Docker Compose
        run: LOCALSTACK_AUTH_TOKEN=unused docker compose --profile frontend config --quiet
      - name: Build frontend Docker image
        run: docker build -f apps/frontend/Dockerfile -t magic-links-frontend:local .
      - id: localstack-token
        name: Check for a LocalStack token
        run: echo "present=${{ secrets.LOCALSTACK_AUTH_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  terraform:
    name: Terraform fmt, validate & static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@v6
      - run: tflint --init && tflint --format compact
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          config_file: infrastructure/terraform/.checkov.yaml

  integration:
    name: Terraform plan/apply, integration, API & browser E2E tests (LocalStack + Docker)
    runs-on: ubuntu-latest
    needs: [quality, terraform]
    # Needs a LocalStack token with Cognito (repository secret).
    if: needs.quality.outputs.has-localstack-token == 'true'
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: npm ci
      - name: Start LocalStack (Docker Compose)
        run: |
          echo "LOCALSTACK_AUTH_TOKEN=$LOCALSTACK_AUTH_TOKEN" > .env
          make up
      - name: Terraform plan
        run: |
          make build
          terraform -chdir=infrastructure/terraform init -input=false
          terraform -chdir=infrastructure/terraform plan -input=false -no-color -out=tfplan | tee tfplan.txt
          { echo '### Terraform plan (LocalStack)'; echo '```'; grep -E '^Plan:|will be (created|updated|destroyed|replaced)' tfplan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Terraform plan
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan
          path: tfplan.txt
      - name: Deploy infrastructure with Terraform
        run: make infra
      - name: Integration tests
        run: npm run test:integration
      - name: API collection tests
        run: npm run test:api
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser E2E tests (production frontend image)
        run: make test-e2e-docker
      - name: Terminal demo (smoke test)
        run: make demo EMAIL=ci@example.com
      - name: LocalStack and frontend logs
        if: failure()
        run: docker compose --profile frontend logs | tail -300
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
